name = "dental-guide-notify"
main = "server/worker.mjs"
compatibility_date = "2026-10-29"
workers_dev = true

[observability]
enabled = false

[vars]
# Exact GitHub Pages origin; do not append /dental-guide/ here.
ALLOWED_ORIGINS = "https://wdddddd67.github.io"
NOTIFICATION_CHANNELS = "serverchan"

[[durable_objects.bindings]]
name = "DELIVERY"
class_name = "DeliveryCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeliveryCoordinator"]

# Runtime secrets: IP_HASH_SALT, RESEND_API_KEY, EMAIL_FROM, EMAIL_TO.
# For WeCom: NOTIFICATION_CHANNELS="wecom" and WECOM_WEBHOOK_URL secret.
# For personal WeChat (ServerChan Turbo): NOTIFICATION_CHANNELS="serverchan"
# and SERVERCHAN_SENDKEY secret. Use "email,serverchan" to require both.
# For simultaneous recipients use SERVERCHAN_SENDKEYS (newline/comma-separated,
# maximum 10 unique SCT keys) instead. Store it as a Secret, never in this file.
# Optional signed mobile ingress: DENTAL_GATEWAY_SECRET Secret, same as Supabase.
